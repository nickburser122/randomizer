:root{--bg:#e9ebec;--sf:#f4f5f5;--ink:#22252a;--mut:#656a71;--ln:#d2d6d9;--bd:#757b83;--ac:#b2406a;--acx:#fbf6f8;--tl:#27746d;--tile:#22252a;--d1:#e7a3bd;--d2:#eceeef;--d3:#8ccdc4;--sh:rgba(34,37,42,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#141518;--sf:#1b1d21;--ink:#e4e6e8;--mut:#8a9098;--ln:#2a2d33;--bd:#636a78;--ac:#dc86a6;--acx:#1a1215;--tl:#7cc7bc;--tile:#e9eaec;--d1:#c0517a;--d2:#22252a;--d3:#2f8a82;--sh:rgba(0,0,0,.45);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#141518;--sf:#1b1d21;--ink:#e4e6e8;--mut:#8a9098;--ln:#2a2d33;--bd:#636a78;--ac:#dc86a6;--acx:#1a1215;--tl:#7cc7bc;--tile:#e9eaec;--d1:#c0517a;--d2:#22252a;--d3:#2f8a82;--sh:rgba(0,0,0,.45);color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
body{font-size:16px}
.wrap{max-width:800px;margin:0 auto;padding:30px 20px 90px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:12px;font:400 35px/1 'Instrument Serif',Georgia,serif;letter-spacing:-.015em}
.brand h1{margin:0;padding-bottom:4px;font:inherit;letter-spacing:inherit}
.logo{width:34px;height:34px;display:block}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mode{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;font-size:13px}
.mode::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.tabs{display:inline-flex;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:3px;gap:2px}
.tab{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500;color:var(--mut);transition:color .15s,background .15s}
.tab:hover{color:var(--ink)}
.f>.tabs{align-self:flex-start}
.tab.on{background:var(--ink);color:var(--bg)}
.out{background:var(--sf);border:1px solid var(--ln);border-radius:26px 26px 26px 8px;padding:30px 32px 24px;box-shadow:0 10px 30px -18px var(--sh)}
.big{font:400 24px/1.5 'Geist Mono',ui-monospace,monospace;letter-spacing:.01em;word-break:break-all;min-height:40px;white-space:pre-wrap}
.big i{font-style:normal}
.l{color:var(--ink)}.d{color:var(--ac);font-weight:500}.s{color:var(--tl)}
.big.empty{font:400 16px/1.5 'Instrument Sans',sans-serif;color:var(--mut)}
.list{display:grid;gap:2px;margin-top:12px}
.li{display:block;text-align:left;border:0;background:transparent;border-radius:10px;padding:7px 12px;margin:0 -12px;font:400 14px/1.45 'Geist Mono',ui-monospace,monospace;word-break:break-all;white-space:pre-wrap}
.li:hover{background:var(--bg)}
.meter{height:3px;border-radius:3px;background:var(--ln);margin:24px 0 18px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:3px;background:var(--ac);transition:width .3s,background .3s}
.meter i.g1{background:var(--tl)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ent{flex:1;min-width:150px;color:var(--mut);font-size:13.5px}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px 32px;margin-top:34px;padding:0 4px}
.f{display:flex;flex-direction:column;gap:8px;min-width:0}
.full{grid-column:1/-1}
.lb{font-size:13px;font-weight:500;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.dd-b{display:block;width:100%;min-width:0;min-height:42px;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:9px 34px 9px 12px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-b:hover,.dd.open .dd-b{border-color:var(--ink)}
.dd-b::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border:solid var(--mut);border-width:0 1.5px 1.5px 0;transform:translateY(-70%) rotate(45deg);transition:transform .15s}
.dd-m{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:100%;max-height:300px;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:5px;z-index:30;box-shadow:0 14px 34px -8px var(--sh)}
.dd-o{padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.dd-o:hover,.dd-o:focus-visible{background:var(--bg)}
.dd-o:focus-visible{outline-offset:-2px}
.dd-o.on{color:var(--ac);font-weight:600}
